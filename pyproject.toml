[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-orchestra"
version = "0.1.0"
description = "Local automation for ComfyUI video workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Felix Bembiev" }]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic-settings>=2.4,<3",
    "rich>=13.7,<15",
    "typer>=0.12,<1",
    "websocket-client>=1.8,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[project.scripts]
video-orchestra = "video_orchestra.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
